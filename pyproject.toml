[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvester"
version = "0.1.0"
description = "Collects recent, niche STEM datasets for contamination-resistant AI benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.0",
    "playwright>=1.45",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
harvester = "harvester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harvester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["kaggle.*", "kagglesdk.*"]
ignore_missing_imports = true
